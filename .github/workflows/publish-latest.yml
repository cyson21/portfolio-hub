name: publish-latest-artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'artifacts/**'
      - 'scripts/verify_public_assets.py'
      - '.github/workflows/publish-latest.yml'

permissions:
  contents: write

concurrency:
  group: portfolio-latest-release
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 scripts/verify_public_assets.py
      - name: Create or refresh latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Latest resume and portfolio artifacts" --notes "Stable endpoints for the latest verified resume PDFs and portfolio HTML files."
          fi
          {
            printf '%s\n' manifest.json
            jq -r '.assets[].name' artifacts/manifest.json
          } | sort -u > /tmp/expected-release-assets.txt
          gh release view latest --json assets --jq '.assets[].name' | while read -r asset; do
            if ! grep -Fqx "$asset" /tmp/expected-release-assets.txt; then
              gh release delete-asset latest "$asset" --yes
            fi
          done
          gh release upload latest artifacts/* --clobber
